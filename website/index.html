<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="bmfk — Backend Modular Framework Kit. A TypeScript framework for HTTP API services with an operations console, signed deploys, blue-green releases and deploy review." />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>bmfk — Backend Modular Framework Kit</title>
    <script>
      // Before first paint, so a dark-theme reader never sees a white flash.
      try { const t = localStorage.getItem("theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
