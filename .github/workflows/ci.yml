name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [24, 26]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build            # monitor UI from source, then @bmfk/api
      - run: npm test -w @bmfk/api
      - run: npm run build -w @bmfk/sandbox   # the public API compiles for a consumer (skipLibCheck off)
      - run: npm audit --omit=dev --audit-level=moderate

  website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run build -w bmfk-website
